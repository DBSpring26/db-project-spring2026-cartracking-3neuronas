services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cartracking-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile.api
    container_name: cartracking-api
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT}

  web:
    build:
      context: ./web_application
      dockerfile: Dockerfile.web
    container_name: cartracking-web
    depends_on:
      - api
    env_file:
      - .env
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: ${API_BASE_URL}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
      CURSOR_API_KEY: ${CURSOR_API_KEY}
      CURSOR_AGENT_RUNTIME: ${CURSOR_AGENT_RUNTIME:-local}

volumes:
  postgres_data:
