services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cartracking-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
      POSTGRES_DB: car_tracking
    ports:
      - "5432:5432"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: cartracking-api
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_NAME: car_tracking
      DB_USER: admin
      DB_PASSWORD: root
      DB_PORT: 5432